name: Deploy pipeline

on: 
  push: 
    branches: ["ToDoApp"]

env:
  AZURE_WEBAPP_NAME: ToDoApp2
  DOCKER_IMAGE_NAME: rbgd32/leaderboardcoreapp
  DOTNET_CORE_VERSION: 9.0.x
  WORKING_DIRECTORY: ./ToDo

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore dependencies
      run: dotnet restore ${{ env.WORKING_DIRECTORY }}
    - name: Build
      run: dotnet build --no-restore ${{ env.WORKING_DIRECTORY }}
      
  docker-build: 
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
    - name: Build and push Docker image
      run: |
        IMAGE_TAG=${{ github.sha }}
        docker build ${{ env.WORKING_DIRECTORY }} -t ${{ env.DOCKER_IMAGE_NAME }}:$IMAGE_TAG
        docker push ${{ env.DOCKER_IMAGE_NAME }}:$IMAGE_TAG
  deploy: 
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps: 
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TODO }}
        images: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} 
