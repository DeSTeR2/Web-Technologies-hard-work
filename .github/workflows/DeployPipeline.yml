name: Deploy pipeline

on: 
  push: 
    branches: ["CoreApp"]

env:
  AZURE_WEBAPP_NAME: LeaderboardAppV2
  DOCKER_IMAGE_NAME: rbgd32/leaderboardcoreapp
  DOTNET_CORE_VERSION: 9.0.x
  WORKING_DIRECTORY: ./MVC_API_CoreApp

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore ${{ env.WORKING_DIRECTORY }}
    - name: Build
      run: dotnet build --no-restore ${{ env.WORKING_DIRECTORY }}
      
  test:
    runs-on: ubuntu-latest
    needs: build
    steps: 
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Test
      run: dotnet test --no-build --verbosity normal ${{ env.WORKING_DIRECTORY }}

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build and push Docker image
        run: |
          SHORT_SHA=${{ github.sha::0:7 }}   # short sha (illustrative)
          IMAGE_TAG=${SHORT_SHA:-${{ github.sha }}} 
          docker build ${{ env.WORKING_DIRECTORY }} -t ${{ env.DOCKER_IMAGE_NAME }}:$IMAGE_TAG
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:$IMAGE_TAG ${{ env.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ env.DOCKER_IMAGE_NAME }}:$IMAGE_TAG
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    steps:
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.DOCKER_IMAGE_NAME }}:latest

